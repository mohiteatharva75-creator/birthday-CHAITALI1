<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Birthday Memories 🎂</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="photos-page">

    <!-- Floating decorations -->
    <div id="decorations"></div>


    <div class="memory-page">

        <h1>
            📸 Birthday Memories 🎂
        </h1>

        <p class="memory-intro">
            A few beautiful moments to make
            this birthday a little more memorable. ✨
        </p>


        <!-- PHOTO -->

        <div class="photo-frame">

            <img
                id="changingPhoto"
                src="photos/photo1.jpeg"
                alt="Birthday Memory"
            >

        </div>


        <!-- CHANGING LINE -->

        <div
            id="memoryText"
            class="memory-text"
        >
            🌸 Keep smiling and keep making
            beautiful memories.
        </div>


        <!-- FINAL MESSAGE -->

        <p class="final-message">

            🎈 Wishing you lots of happiness,
            laughter and wonderful moments ahead.

            <br>

            <strong>
                Happy Birthday, Chaitali! 🎉
            </strong>

        </p>


        <a
            href="wish.html"
            class="back-button"
        >
            ← Back to Wishes
        </a>

    </div>


    <script src="script.js"></script>

</body>

</html>
